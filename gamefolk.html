Kira held the door until her last bullet while Vanya sang the dwarf anthem in voice chat. We reached the pod three seconds before launch.`,game:"Deep Rock Galactic",people:[0,1],tags:["epic","coop","night"],when:{kind:"approx",year:2021,season:"spring"},starred:!0},{title:"How we found Kira in matchmaking",text:"She played position five and carried a lost game. A week later we were playing every evening.",game:"Dota 2",people:[0],tags:["first meeting"],when:{kind:"approx",year:2019,season:"autumn"},starred:!0},{title:"Matt spoke no Russian at all",text:'We talked with flashlight signals. By the end of the night Matt learned the word for "run" and shouted it louder than anyone.',game:"Lethal Company",people:[3],names:["Matt's neighbour"],randomPlayers:2,tags:["funny"],when:{kind:"approx",year:2023,season:"winter"}},{title:"A proper funeral for the longship",text:"The ship sank in the first storm with two weeks of iron. Lena gave a speech, Vanya played harmonica into the mic.",game:"Valheim",people:[2,1],tags:["funny","fail"],when:{kind:"exact",date:"2022-08-12"}},{title:"The server we built for half a year",text:"Lena did the castle, Dan the farms, I did the roads. The roads came out crooked, but you can see them from space.",game:"Minecraft",people:[2,4],tags:["coop"],when:{kind:"approx",year:2020,season:null}},{title:"Dan leaves for the army",text:'Last evening on the server. Dan put a sign by the farm: "back soon, do not touch the cows". Nobody touched the cows.',game:"Minecraft",people:[4,2],tags:["sad"],when:{kind:"approx",year:2021,season:"autumn"},starred:!0},{title:"New Year in the mine",text:"We met midnight in a cave under a collapse, with the last drink from the station bar. Vanya counted down out loud and lost track at seven.",game:"Deep Rock Galactic",people:[0,1],tags:["holiday","coop"],when:{kind:"exact",date:"2023-12-31"}},{title:"40 minutes in mid",text:"Longest game of the year. We won when the other team lost internet and laughed until morning.",game:"Dota 2",people:[0],randomPlayers:3,tags:["epic"],when:{kind:"approx",year:2020,season:"summer"}}]}},R1={es:{people:[["En contacto","Siempre va de support.","Me toc\xF3 con ella en una partida, iba de posici\xF3n cinco. Salv\xF3 una partida que todos daban por perdida. Le escrib\xED \xAB\xBFotra?\xBB, me contest\xF3 \xABva\xBB."],["En contacto","Canta en el chat de voz cuando se pone nervioso.","Compa\xF1ero de clase. Fue el primero en invitarme a Deep Rock."],["En contacto","La que mejor construye del servidor.",""],["Perdimos el contacto","Es de Canad\xE1.","Lobby aleatorio."],["Perdimos el contacto","",""]],stories:[["La incursi\xF3n nocturna que nos salv\xF3 a todos",`Era m\xE1s de la una de la madrugada y aceptamos una misi\xF3n m\xE1s. El enjambre lleg\xF3 antes de que Vanya pudiera poner la torreta.

Kira aguant\xF3 la puerta hasta la \xFAltima bala mientras Vanya cantaba el himno de los enanos por el chat de voz. Llegamos a la c\xE1psula tres segundos antes del despegue.`,["\xE9pico","coop","noche"]],["C\xF3mo encontramos a Kira en una partida","Jug\xF3 de posici\xF3n cinco y remont\xF3 una partida perdida. Una semana despu\xE9s jug\xE1bamos juntos cada noche.",["primer encuentro"]],["Matt no sab\xEDa ni una palabra de ruso","Nos entend\xEDamos con se\xF1ales de linterna. Al final de la noche Matt aprendi\xF3 a decir \xABcorre\xBB en ruso y lo gritaba m\xE1s fuerte que nadie.",["divertido"],["El vecino de Matt"]],["Un funeral digno para el drakkar","El barco se hundi\xF3 en la primera tormenta con dos semanas de hierro dentro. Lena dio un discurso y Vanya toc\xF3 la arm\xF3nica por el micro.",["divertido","fail"]],["El servidor que construimos durante medio a\xF1o","Lena hizo el castillo, Dan las granjas y yo los caminos. Los caminos quedaron torcidos, pero se ven desde el espacio.",["coop"]],["Dan se va al servicio militar","\xDAltima noche en el servidor. Dan puso un cartel junto a la granja: \xABvuelvo pronto, que nadie toque las vacas\xBB. Nadie toc\xF3 las vacas.",["triste"]],["A\xF1o Nuevo en la mina","Recibimos la medianoche en una cueva, bajo un derrumbe, con la \xFAltima bebida del bar de la estaci\xF3n. Vanya contaba en voz alta y se perdi\xF3 en el siete.",["fiesta","coop"]],["40 minutos en mid","La partida m\xE1s larga del a\xF1o. Ganamos cuando al otro equipo se le cay\xF3 internet y nos re\xEDmos hasta el amanecer.",["\xE9pico"]]]},pt:{people:[["Em contato","Sempre joga de suporte.","Caiu comigo numa partida, de posi\xE7\xE3o cinco. Virou um jogo que todo mundo j\xE1 tinha dado como perdido. Mandei \u201Cmais uma?\u201D, ela respondeu \u201Cbora\u201D."],["Em contato","Canta no chat de voz quando fica nervoso.","Colega de escola. Foi o primeiro a me chamar para o Deep Rock."],["Em contato","A melhor construtora do servidor.",""],["Perdemos contato","\xC9 do Canad\xE1.","Lobby aleat\xF3rio."],["Perdemos contato","",""]],stories:[["A invas\xE3o da madrugada que salvou todo mundo",`J\xE1 passava da uma da manh\xE3 e pegamos mais uma miss\xE3o. O enxame chegou antes de o Vanya conseguir montar a torreta.

A Kira segurou a porta at\xE9 a \xFAltima bala enquanto o Vanya cantava o hino dos an\xF5es no chat de voz. Chegamos na c\xE1psula tr\xEAs segundos antes da decolagem.`,["\xE9pico","coop","madrugada"]],["Como achamos a Kira numa partida","Ela jogou de posi\xE7\xE3o cinco e virou uma partida perdida. Uma semana depois a gente jogava junto toda noite.",["primeiro encontro"]],["O Matt n\xE3o falava nada de russo","A gente se comunicava piscando a lanterna. No fim da noite o Matt aprendeu a dizer \u201Ccorre\u201D em russo e gritava mais alto que todo mundo.",["engra\xE7ado"],["O vizinho do Matt"]],["Um enterro digno para o drakkar","O barco afundou na primeira tempestade com duas semanas de ferro dentro. A Lena fez um discurso e o Vanya tocou gaita no microfone.",["engra\xE7ado","fail"]],["O servidor que constru\xEDmos por meio ano","A Lena fez o castelo, o Dan as fazendas e eu as estradas. As estradas ficaram tortas, mas d\xE1 para ver do espa\xE7o.",["coop"]],["O Dan vai para o ex\xE9rcito","\xDAltima noite no servidor. O Dan deixou uma placa na fazenda: \u201Cvolto logo, n\xE3o mexam nas vacas\u201D. Ningu\xE9m mexeu nas vacas.",["triste"]],["Ano-novo na mina","Viramos a meia-noite numa caverna, debaixo de um desabamento, com a \xFAltima bebida do bar da esta\xE7\xE3o. O Vanya contava em voz alta e se perdeu no sete.",["festa","coop"]],["40 minutos no mid","A partida mais longa do ano. Ganhamos quando a internet do outro time caiu e rimos at\xE9 de manh\xE3.",["\xE9pico"]]]},de:{people:[["In Kontakt","Spielt immer Support.","Wurde mir als Position f\xFCnf zugelost. Hat ein Spiel gedreht, das alle schon aufgegeben hatten. Ich schrieb \u201Enoch eine?\u201C, sie schrieb \u201Eklar\u201C."],["In Kontakt","Singt im Voice-Chat, wenn er nerv\xF6s ist.","Klassenkamerad. Hat mich als Erster zu Deep Rock eingeladen."],["In Kontakt","Baut am besten auf dem ganzen Server.",""],["Aus den Augen verloren","Kommt aus Kanada.","Zuf\xE4llige Lobby."],["Aus den Augen verloren","",""]],stories:[["Der Nachtangriff, der uns alle gerettet hat",`Es war schon nach eins, und wir haben noch eine Mission angenommen. Der Schwarm kam, bevor Vanya den Gesch\xFCtzturm aufstellen konnte.

Kira hat die T\xFCr bis zur letzten Kugel gehalten, w\xE4hrend Vanya im Voice-Chat die Zwergenhymne gesungen hat. Wir waren drei Sekunden vor dem Start an der Kapsel.`,["episch","koop","nachts"]],["Wie wir Kira im Matchmaking gefunden haben","Sie spielte Position f\xFCnf und hat ein verlorenes Spiel gedreht. Eine Woche sp\xE4ter haben wir jeden Abend zusammen gezockt.",["kennenlernen"]],["Matt konnte kein Wort Russisch","Wir haben uns mit Taschenlampen-Signalen verst\xE4ndigt. Am Ende des Abends konnte Matt \u201Elauf\u201C auf Russisch und hat es lauter gerufen als alle anderen.",["lustig"],["Matts Nachbar"]],["Ein w\xFCrdiges Begr\xE4bnis f\xFCr das Langschiff","Das Schiff ist im ersten Sturm gesunken, mit dem Eisen von zwei Wochen an Bord. Lena hat eine Rede gehalten, Vanya hat ins Mikro Mundharmonika gespielt.",["lustig","fail"]],["Der Server, an dem wir ein halbes Jahr gebaut haben","Lena hat die Burg gebaut, Dan die Farmen und ich die Stra\xDFen. Die Stra\xDFen sind schief geworden, aber man sieht sie aus dem Weltall.",["koop"]],["Dan geht zur Armee","Der letzte Abend auf dem Server. Dan hat ein Schild an die Farm gestellt: \u201Ebin bald zur\xFCck, lasst die K\xFChe in Ruhe\u201C. Niemand hat die K\xFChe anger\xFChrt.",["traurig"]],["Silvester in der Mine","Wir haben Mitternacht in einer H\xF6hle unter einem Einsturz erlebt, mit dem letzten Drink aus der Stationsbar. Vanya hat laut runtergez\xE4hlt und sich bei sieben verz\xE4hlt.",["feiertag","koop"]],["40 Minuten auf Mid","Das l\xE4ngste Spiel des Jahres. Gewonnen haben wir, als beim anderen Team das Internet ausfiel, und dann bis zum Morgen gelacht.",["episch"]]]},fr:{people:[["En contact","Joue toujours support.","Tomb\xE9e avec moi en partie, en position cinq. Elle a retourn\xE9 une partie que tout le monde avait abandonn\xE9e. J\u2019ai \xE9crit \xAB\xA0on en refait une\xA0?\xA0\xBB, elle a r\xE9pondu \xAB\xA0vas-y\xA0\xBB."],["En contact","Chante dans le vocal quand il stresse.","Camarade de classe. Le body{margin:0;background:#f5f2ec;color:#1d1d1f;font:17px/1.65 Georgia,'Times New Roman',serif}
